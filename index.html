<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emotion Buddy — 50 Emotions</title>
<style>
:root{--bg:#f8f6ff;--card:#fff;--ink:#28233a;--muted:#716b80;--accent:#7357d8;--soft:#eee9ff;--line:#e4dff0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f8f6ff,#fffaf2);color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:28px 16px 50px}header{text-align:center;padding:10px 0 22px}
h1{font-size:clamp(30px,7vw,48px);margin:0 0 8px}header p{color:var(--muted);font-size:16px;margin:0 auto;max-width:650px}.creator{color:var(--accent);font-size:14px;margin:-2px 0 8px;letter-spacing:.2px}
.search{display:flex;gap:9px;max-width:720px;margin:0 auto 15px}input{flex:1;min-width:0;padding:15px 16px;border:2px solid var(--line);border-radius:14px;font-size:16px;outline:none;background:white}input:focus{border-color:var(--accent)}
.search button{border:0;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:white}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:15px 0 22px}
.emotion-btn{background:white;color:var(--ink);border:1px solid var(--line);padding:11px 8px;border-radius:13px;min-height:54px;cursor:pointer;font-weight:600}.emotion-btn:hover{background:var(--soft)}
.result{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(40,25,80,.07);display:none}.result.show{display:block}
.emotion-title{font-size:28px;font-weight:800;margin-bottom:10px}.definition{font-size:17px;line-height:1.65;color:#403a50}.label{font-weight:800;font-size:17px;margin:22px 0 8px}
ul{padding-left:22px;margin:0}li{margin:10px 0;line-height:1.5}.count{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media(max-width:520px){.search{flex-direction:column}.search button{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.result{padding:19px}}
</style></head>
<body><div class="wrap">
<header><h1>🌈 Emotion Buddy</h1><div class="creator">Created by <strong>Miraya K R</strong></div><p>Type an emotion or tap one below to understand it and discover simple ways to work with it.</p></header>
<form class="search" id="searchForm"><input id="searchInput" placeholder="Try: angry, happy, anxious..." autocomplete="off" aria-label="Search emotion"><button type="submit">Search</button></form>
<div class="hint">50 emotions • simple definitions • practical tips</div><div class="grid" id="emotionGrid"></div>
<div id="result" class="result" aria-live="polite"></div><div class="count" id="count"></div></div>
<script>
const emotions=[{"name": "Happy", "emoji": "😊", "definition": "A pleasant feeling of joy, satisfaction, or contentment.", "tips": ["Spend time with people who make you feel good.", "Notice and appreciate small positive moments.", "Do something you genuinely enjoy.", "Practice gratitude for things going well.", "Share your happiness with someone else."]}, {"name": "Sad", "emoji": "😢", "definition": "A natural emotion that can arise with loss, disappointment, loneliness, or hurt.", "tips": ["Allow yourself to feel instead of forcing yourself to be okay.", "Talk to someone you trust.", "Do one small comforting activity.", "Rest and take care of your basic needs."]}, {"name": "Angry", "emoji": "😡", "definition": "A strong emotion that can arise when we feel hurt, frustrated, threatened, or treated unfairly.", "tips": ["Pause before reacting.", "Take slow, deep breaths.", "Step away briefly if possible.", "Express what upset you calmly instead of attacking."]}, {"name": "Anxious", "emoji": "😰", "definition": "A feeling of worry, nervousness, or fear about something that may happen or feel uncertain.", "tips": ["Slow your breathing and lengthen your exhale.", "Focus on what is happening right now.", "Break the problem into one small step.", "Talk to someone you trust."]}, {"name": "Afraid", "emoji": "😨", "definition": "An emotional response to something we perceive as dangerous, threatening, or uncertain.", "tips": ["Take slow breaths and ground yourself.", "Identify what is actually happening right now.", "Move toward safety if there is real danger.", "Talk through the fear with someone supportive."]}, {"name": "Excited", "emoji": "🤩", "definition": "An energized, positive feeling that happens when we anticipate something enjoyable or meaningful.", "tips": ["Enjoy the moment instead of rushing through it.", "Share your excitement with someone.", "Use the energy for a meaningful activity.", "Pause and appreciate why the moment matters."]}, {"name": "Calm", "emoji": "😌", "definition": "A peaceful state in which the mind and body feel settled and less overwhelmed.", "tips": ["Protect some quiet time each day.", "Practice slow breathing.", "Spend time in a comfortable environment.", "Notice what helps you feel peaceful and repeat it."]}, {"name": "Lonely", "emoji": "🥺", "definition": "The feeling of lacking meaningful connection or companionship, even when other people may be around.", "tips": ["Reach out to one trusted person.", "Join an activity where you can connect with others.", "Do something caring for yourself.", "Remember that loneliness is a feeling, not a permanent situation."]}, {"name": "Jealous", "emoji": "💚", "definition": "A feeling that can arise when we fear losing something important or compare ourselves with someone else.", "tips": ["Identify what you are afraid of losing.", "Separate facts from assumptions.", "Focus on your own progress.", "Communicate your feelings honestly without blaming."]}, {"name": "Guilty", "emoji": "😔", "definition": "An uncomfortable feeling that can appear when we believe our actions have harmed someone or gone against our values.", "tips": ["Ask whether you actually did something wrong.", "If appropriate, take responsibility and apologize.", "Learn from the situation instead of repeatedly punishing yourself.", "Practice self-forgiveness after making amends."]}, {"name": "Ashamed", "emoji": "🫣", "definition": "A painful feeling of believing that something about oneself is unacceptable or unworthy.", "tips": ["Separate your action from your identity.", "Talk to someone safe and supportive.", "Challenge harsh self-judgments.", "Focus on what you can learn or change."]}, {"name": "Embarrassed", "emoji": "😳", "definition": "A temporary uncomfortable feeling when we think others have noticed something awkward about us.", "tips": ["Remind yourself that everyone makes mistakes.", "Take a breath and let the moment pass.", "Avoid replaying the event repeatedly.", "Use gentle humor when appropriate."]}, {"name": "Frustrated", "emoji": "😤", "definition": "A feeling that occurs when something blocks our goals, expectations, or efforts.", "tips": ["Pause before reacting.", "Identify exactly what is blocking you.", "Try one alternative approach.", "Take a short break if you are overwhelmed."]}, {"name": "Confused", "emoji": "😵", "definition": "A state of uncertainty when information, choices, or situations are difficult to understand.", "tips": ["Slow down and identify what you do understand.", "Organize the information simply.", "Ask for clarification.", "Handle one question at a time."]}, {"name": "Worried", "emoji": "😟", "definition": "Repeated thinking about possible problems or negative outcomes.", "tips": ["Ask whether the worry is about something you can act on.", "Write down the concern and one practical next step.", "Set aside a short worry period instead of worrying all day.", "Return your attention to the present task."]}, {"name": "Stressed", "emoji": "😫", "definition": "The mental and physical response that can occur when demands feel greater than our available resources.", "tips": ["Break large tasks into smaller steps.", "Take short recovery breaks.", "Prioritize what truly needs attention now.", "Maintain sleep, food, hydration, and movement."]}, {"name": "Overwhelmed", "emoji": "🌊", "definition": "A feeling that demands, thoughts, or emotions are too much to manage at once.", "tips": ["Stop and focus only on the next small step.", "Reduce unnecessary tasks temporarily.", "Use slow breathing or grounding.", "Ask for practical support when needed."]}, {"name": "Hopeful", "emoji": "🌱", "definition": "A feeling that positive possibilities may exist and that our actions can contribute to a better outcome.", "tips": ["Picture a realistic positive possibility.", "Choose one action that supports it.", "Notice small signs of progress.", "Keep supportive people around you."]}, {"name": "Grateful", "emoji": "🙏", "definition": "A feeling of appreciation for people, experiences, opportunities, or things we value.", "tips": ["Name three things you appreciate.", "Tell someone you are grateful for them.", "Notice ordinary moments that bring comfort.", "Keep a simple gratitude habit."]}, {"name": "Proud", "emoji": "🌟", "definition": "A feeling of satisfaction from recognizing your effort, growth, achievements, or values.", "tips": ["Acknowledge the effort behind your achievement.", "Celebrate without comparing yourself with others.", "Record progress you want to remember.", "Use success as motivation for the next goal."]}, {"name": "Confident", "emoji": "💪", "definition": "The belief that you can approach a situation and handle challenges using your abilities and resources.", "tips": ["Remember previous situations you handled well.", "Prepare for important tasks.", "Use realistic positive self-talk.", "Take small actions that build competence."]}, {"name": "Insecure", "emoji": "🫤", "definition": "Uncertainty about your worth, abilities, appearance, relationships, or place in a situation.", "tips": ["Identify the specific thought behind the insecurity.", "Question comparisons with others.", "Focus on skills and qualities you are developing.", "Talk to someone who helps you see yourself realistically."]}, {"name": "Disappointed", "emoji": "😞", "definition": "The sadness or frustration we feel when reality does not match what we hoped or expected.", "tips": ["Acknowledge the feeling.", "Separate the outcome from your self-worth.", "Ask what you can learn from the experience.", "Identify another realistic path forward."]}, {"name": "Hurt", "emoji": "💔", "definition": "Emotional pain that can follow rejection, loss, criticism, betrayal, or an upsetting experience.", "tips": ["Give yourself time to process what happened.", "Talk to someone trustworthy.", "Set boundaries if someone continues to hurt you.", "Choose activities that support recovery rather than rumination."]}, {"name": "Love", "emoji": "❤️", "definition": "A deep feeling of care, affection, attachment, or concern for another person or oneself.", "tips": ["Express appreciation openly.", "Listen carefully to people you care about.", "Respect healthy boundaries.", "Show care through consistent actions.", "Include yourself in the care you give others."]}, {"name": "Peaceful", "emoji": "🕊️", "definition": "A state of inner quiet, acceptance, and reduced emotional tension.", "tips": ["Create small quiet moments during the day.", "Breathe slowly and notice your surroundings.", "Reduce unnecessary stimulation when possible.", "Spend time doing activities that genuinely settle you."]}, {"name": "Relieved", "emoji": "😮‍💨", "definition": "The feeling of tension decreasing after a difficult, uncertain, or threatening situation improves.", "tips": ["Recognize that the difficult moment has passed.", "Let your body relax instead of immediately rushing ahead.", "Reflect on what helped you cope.", "Give yourself time to recover."]}, {"name": "Content", "emoji": "😊", "definition": "A quiet sense of satisfaction with what is present rather than constantly needing something more.", "tips": ["Notice what is already going well.", "Reduce unnecessary comparison.", "Enjoy simple routines.", "Practice appreciation for the present moment."]}, {"name": "Bored", "emoji": "🥱", "definition": "A feeling of low stimulation or lack of interest in what we are currently doing.", "tips": ["Try a small new activity.", "Learn something you are curious about.", "Change your environment briefly.", "Use boredom as a chance for creativity or rest."]}, {"name": "Tired", "emoji": "😴", "definition": "A feeling of reduced energy that can result from effort, emotional strain, lack of rest, or prolonged concentration.", "tips": ["Give yourself adequate rest.", "Eat and hydrate regularly.", "Take short breaks during demanding tasks.", "Notice whether tiredness is becoming persistent and seek appropriate support."]}, {"name": "Energetic", "emoji": "⚡", "definition": "A state of having physical or mental vitality and readiness to engage in activities.", "tips": ["Use the energy for meaningful tasks.", "Include enjoyable physical activity.", "Keep a healthy sleep routine.", "Balance activity with recovery."]}, {"name": "Curious", "emoji": "🔎", "definition": "The desire to explore, understand, discover, or learn something new.", "tips": ["Ask questions.", "Explore a new topic or skill.", "Read or observe with an open mind.", "Turn curiosity into a small project."]}, {"name": "Surprised", "emoji": "😲", "definition": "The emotional response we experience when something happens unexpectedly.", "tips": ["Pause before deciding how to respond.", "Take in the new information carefully.", "Notice what the surprise is telling you.", "Give yourself time to adjust when needed."]}, {"name": "Disgusted", "emoji": "🤢", "definition": "An aversive emotion that can occur when something feels unpleasant, contaminated, offensive, or unacceptable.", "tips": ["Move away from the unpleasant stimulus when appropriate.", "Take a moment to settle your body.", "Identify whether the reaction is physical or emotional.", "Respond according to your values rather than acting impulsively."]}, {"name": "Resentful", "emoji": "😒", "definition": "Lingering anger or hurt that can develop when we feel repeatedly treated unfairly or unappreciated.", "tips": ["Identify what you feel was unfair.", "Decide whether a boundary or conversation is needed.", "Express your needs clearly when appropriate.", "Work toward releasing what you cannot change."]}, {"name": "Regretful", "emoji": "😣", "definition": "Sadness or disappointment about a past choice or action that we wish had been different.", "tips": ["Accept that the past cannot be changed.", "Identify what the experience can teach you.", "Make amends when possible.", "Use the lesson to guide future choices."]}, {"name": "Nostalgic", "emoji": "📷", "definition": "A warm or bittersweet feeling that arises when remembering meaningful experiences from the past.", "tips": ["Enjoy positive memories without getting stuck in them.", "Reconnect with safe traditions.", "Create new meaningful memories.", "Accept that life changes over time."]}, {"name": "Homesick", "emoji": "🏠", "definition": "Sadness or longing for familiar people, places, routines, or comforts when away from home.", "tips": ["Stay connected with supportive people.", "Create familiar routines in your current environment.", "Bring a comforting reminder of home.", "Explore your new environment gradually."]}, {"name": "Motivated", "emoji": "🚀", "definition": "The feeling of willingness and energy to move toward a goal or meaningful activity.", "tips": ["Choose a clear small goal.", "Start before you feel perfectly ready.", "Track small progress.", "Connect the task with a meaningful reason."]}, {"name": "Discouraged", "emoji": "🌧️", "definition": "A feeling of reduced confidence or hope after difficulties, setbacks, or slow progress.", "tips": ["Take a short break without giving up.", "Look at progress rather than only the setback.", "Make the next step smaller.", "Seek encouragement from someone supportive."]}, {"name": "Impatient", "emoji": "⏳", "definition": "The urge for something to happen immediately when waiting or slow progress feels difficult.", "tips": ["Notice the urge before acting.", "Take a few slow breaths.", "Focus on what you can do while waiting.", "Remind yourself that not everything can be rushed."]}, {"name": "Optimistic", "emoji": "☀️", "definition": "A tendency to notice possibilities and believe that positive outcomes can be possible.", "tips": ["Look for realistic possibilities.", "Focus on actions within your control.", "Learn from setbacks without assuming the worst.", "Surround yourself with constructive support."]}, {"name": "Pessimistic", "emoji": "🌥️", "definition": "A tendency to expect negative outcomes or focus strongly on possible problems.", "tips": ["Question automatic negative predictions.", "Look for evidence on both sides.", "Identify one realistic alternative outcome.", "Focus on what you can influence."]}, {"name": "Sympathetic", "emoji": "💗", "definition": "Concern for another person's difficulty and a desire to offer care or support.", "tips": ["Listen without immediately judging.", "Ask what support the person needs.", "Offer practical help when appropriate.", "Respect the other person's boundaries."]}, {"name": "Compassionate", "emoji": "🤲", "definition": "Caring about suffering and wanting to respond with kindness and helpful action.", "tips": ["Listen with patience.", "Respond without unnecessary judgment.", "Offer practical support.", "Practice the same kindness toward yourself."]}, {"name": "Grumpy", "emoji": "😠", "definition": "A temporary irritable or unpleasant mood that may arise from stress, tiredness, frustration, or other factors.", "tips": ["Check whether you need food, rest, or a break.", "Pause before speaking sharply.", "Give yourself some quiet space.", "Return to the issue after your mood settles."]}, {"name": "Irritated", "emoji": "😒", "definition": "A feeling of annoyance caused by something that feels bothersome, uncomfortable, or repetitive.", "tips": ["Identify the specific trigger.", "Take a brief pause.", "Change what you can about the situation.", "Communicate your concern calmly."]}, {"name": "Inspired", "emoji": "✨", "definition": "A feeling of enthusiasm or possibility that encourages us to create, learn, or take meaningful action.", "tips": ["Write down the idea while it is fresh.", "Take one small action toward it.", "Explore people or work that spark your interest.", "Protect time for creativity."]}, {"name": "Grief", "emoji": "🖤", "definition": "The emotional response to losing someone, something, or a significant part of life.", "tips": ["Allow your feelings to change from day to day.", "Stay connected with supportive people.", "Maintain gentle routines when possible.", "Give yourself permission to remember and express your loss."]}];
const grid=document.getElementById('emotionGrid'),result=document.getElementById('result'),input=document.getElementById('searchInput'),form=document.getElementById('searchForm');
function show(e){result.classList.add('show');result.innerHTML='<div class="emotion-title">'+e.emoji+' '+e.name+'</div><div class="definition">'+e.definition+'</div><div class="label">💛 Emotion Buddy tips</div><ul>'+e.tips.map(t=>'<li>'+t+'</li>').join('')+'</ul>';result.scrollIntoView({behavior:'smooth',block:'nearest'});}
emotions.forEach(e=>{const b=document.createElement('button');b.type='button';b.className='emotion-btn';b.textContent=e.emoji+' '+e.name;b.addEventListener('click',()=>show(e));grid.appendChild(b);});
document.getElementById('count').textContent=emotions.length+' emotions available';
form.addEventListener('submit',ev=>{ev.preventDefault();const q=input.value.trim().toLowerCase();if(!q){result.classList.remove('show');return}let e=emotions.find(x=>x.name.toLowerCase()===q)||emotions.find(x=>x.name.toLowerCase().includes(q))||emotions.find(x=>q.includes(x.name.toLowerCase()));if(e)show(e);else{result.classList.add('show');result.innerHTML='<div class="empty">I could not find that emotion. Try <b>angry</b>, <b>happy</b>, <b>sad</b>, <b>anxious</b>, or <b>jealous</b>.</div>';}});
</script></body></html>
